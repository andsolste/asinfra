name: Validate website and Study

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate site
        run: python3 scripts/validate-site.py
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/study/package-lock.json
      - name: Install Study dependencies
        working-directory: apps/study
        run: npm ci
      - name: Typecheck and build Study
        working-directory: apps/study
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing repository variable: VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing repository variable: VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          npm test
          npm run build
      - name: Assemble and check publishing directory
        run: python3 scripts/build-pages.py
