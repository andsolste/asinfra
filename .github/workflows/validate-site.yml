name: Validate static website and backend

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate site
        run: python3 scripts/validate-site.py
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - name: Install backend test dependencies
        working-directory: supabase
        run: npm ci
      - name: Test canonical migrations and RLS locally
        working-directory: supabase
        run: npm test
      - name: Assemble and check publishing directory
        run: python3 scripts/build-pages.py
