# Local CLI configuration only; hosted settings are managed separately.
project_id = "asinfra-study"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173/study/"
additional_redirect_urls = ["https://asinfra.no/study/"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
